name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Unit tests (with coverage gates)
        run: |
          pnpm --filter @gatepass/shared exec vitest run --coverage
          pnpm --filter @gatepass/api test:cov
          pnpm --filter @gatepass/web test
      - run: pnpm build

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gatepass/api test:int
        env:
          INT_DB: docker

  docker-smoke:
    name: Docker compose smoke (SM-I-14)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/smoke.sh
      - if: always()
        run: docker compose down -v
