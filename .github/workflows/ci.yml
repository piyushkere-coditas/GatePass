name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Unit tests (with coverage gates)
        run: |
          pnpm --filter @gatepass/shared exec vitest run --coverage
          pnpm --filter @gatepass/api test:cov
          pnpm --filter @gatepass/web test
      - run: pnpm build

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integration tests
        run: |
          set -o pipefail
          pnpm --filter @gatepass/api test:int 2>&1 | tee int.log
        env:
          INT_DB: docker
      - if: failure()
        run: bash scripts/ci-annotate.sh "Integration tests failed" int.log

  docker-smoke:
    name: Docker compose smoke (SM-I-14)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: |
          set -o pipefail
          bash scripts/smoke.sh 2>&1 | tee smoke.log
      - if: failure()
        run: bash scripts/ci-annotate.sh "Docker smoke failed" smoke.log
      - if: always()
        run: docker compose down -v
