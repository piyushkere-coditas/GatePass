# Local stack: `docker compose up -d --build`
#   web      http://localhost:8080   (nginx, proxies /api -> api)
#   api      http://localhost:3000   (GET /health)
#   mailhog  http://localhost:8025   (captured emails)
# For day-to-day development run only the infra (`docker compose up -d postgres mailhog`)
# and use `pnpm --filter @gatepass/api dev` / `pnpm --filter @gatepass/web dev`.
# Photo storage (S3-compatible emulator) is added in Phase 3: MinIO no longer publishes Docker images.

name: gatepass

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gatepass
      POSTGRES_PASSWORD: gatepass
      POSTGRES_DB: gatepass
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gatepass -d gatepass']
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ['1025:1025', '8025:8025']

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      APP_BASE_URL: http://localhost:8080
      DATABASE_URL: postgresql://gatepass:gatepass@postgres:5432/gatepass?schema=public
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-piyush.kere@coditas.com}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      mailhog: { condition: service_started }

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports: ['8080:80']
    depends_on: [api]

volumes:
  pgdata:
