# Local stack: `docker compose up -d --build`
#   web      http://localhost:8080   (nginx, proxies /api -> api)
#   api      http://localhost:3000   (GET /health)
#   mailhog  http://localhost:8025   (captured emails)
#   minio    http://localhost:9001   (console; user/pass from .env)
# For day-to-day development run only the infra (`docker compose up -d postgres minio minio-init mailhog`)
# and use `pnpm --filter @gatepass/api dev` / `pnpm --filter @gatepass/web dev`.

name: gatepass

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gatepass
      POSTGRES_PASSWORD: gatepass
      POSTGRES_DB: gatepass
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gatepass -d gatepass']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest # TODO(Phase 6): pin a release tag
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-gatepass}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-gatepass-secret}
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest # TODO(Phase 6): pin a release tag
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-gatepass} $${S3_SECRET_KEY:-gatepass-secret} &&
      mc mb --ignore-existing local/$${S3_BUCKET:-gatepass-photos} &&
      mc anonymous set none local/$${S3_BUCKET:-gatepass-photos}"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-gatepass}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-gatepass-secret}
      S3_BUCKET: ${S3_BUCKET:-gatepass-photos}

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ['1025:1025', '8025:8025']

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      APP_BASE_URL: http://localhost:8080
      DATABASE_URL: postgresql://gatepass:gatepass@postgres:5432/gatepass?schema=public
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-piyush.kere@coditas.com}
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      mailhog: { condition: service_started }

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports: ['8080:80']
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
